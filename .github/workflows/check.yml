# Runs ci/check.sh, every check the project has, on each pull request and on
# main. The repository is public, so GitHub's standard hosted runners cost no
# Actions minutes here. The checks run as parallel jobs, one per group of
# ci/check.sh; together the groups are every check.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only documents no check reads skips the groups.
  # `check` below still reports, so the required status is met (ci/docs_only.sh
  # lists the documents). Pushes to main and manual runs always run the groups.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this a docs-only pull request?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "docs_only=$(sh ci/docs_only.sh "$BASE_SHA")" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  group:
    name: ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [gcc, clang, sanitize, fuzz, drivers, static, cbmc]
    steps:
      - uses: actions/checkout@v4

      # .agents/setup installs elan into /opt/elan; make it the runner's own so
      # the cache can restore into it.
      - name: Prepare /opt/elan
        run: sudo mkdir -p /opt/elan && sudo chown "$(id -u):$(id -g)" /opt/elan

      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: /opt/elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}

      - name: Cache the Lean build
        if: matrix.group == 'drivers'
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-

      - name: Install the toolchain
        run: bash .agents/setup

      # make format-check expects clang-format 14 (ci/orb/README.md); the
      # runner's own clang-format is newer and can format differently.
      - name: Install clang-format 14
        run: |
          pipx install clang-format==14.0.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # -j runs the builds and the unit tests side by side; -Otarget keeps each
      # test's output together.
      - name: Run the ${{ matrix.group }} checks
        run: MAKEFLAGS="-j$(nproc) -Otarget" CI=1 bash ci/check.sh ${{ matrix.group }}

  # One status to require in branch protection: it passes only when every
  # group passed, or when the groups were skipped for a docs-only change.
  check:
    if: always()
    needs: [changes, group]
    runs-on: ubuntu-24.04
    steps:
      - name: Every group passed
        env:
          CHANGES: ${{ needs.changes.result }}
          GROUPS_RESULT: ${{ needs.group.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          test "$CHANGES" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$GROUPS_RESULT" = skipped
          else
            test "$GROUPS_RESULT" = success
          fi
