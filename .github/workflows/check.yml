# Runs ci/check.sh, every check the project has, on each pull request and on
# main. The repository is public, so GitHub's standard hosted runners cost no
# Actions minutes here. The checks run as parallel jobs, one per group of
# ci/check.sh; together the groups are every check.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which groups a pull request needs (ci/ci_groups.sh): none when it changes only
  # documents no check reads, and cbmc only when it touches what the CBMC proofs
  # read. `check` below still reports, so the required status is met. Pushes to
  # main and manual runs always run every group.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.filter.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which groups does this change need?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            groups=$(sh ci/ci_groups.sh "$BASE_SHA")
          else
            groups='["gcc", "clang", "sanitize", "fuzz", "drivers", "lean", "static", "cbmc"]'
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Groups: $groups"

  group:
    name: ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      # .agents/setup installs elan into /opt/elan; make it the runner's own so
      # the cache can restore into it.
      - name: Prepare /opt/elan
        run: sudo mkdir -p /opt/elan && sudo chown "$(id -u):$(id -g)" /opt/elan

      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: /opt/elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}

      - name: Cache the Lean build
        if: matrix.group == 'lean'
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-

      - name: Install the toolchain
        run: bash .agents/setup

      # make format-check expects clang-format 14 (ci/orb/README.md); the
      # runner's own clang-format is newer and can format differently.
      - name: Install clang-format 14
        run: |
          pipx install clang-format==14.0.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # -j runs the builds and the unit tests side by side; -Otarget keeps each
      # test's output together.
      - name: Run the ${{ matrix.group }} checks
        run: MAKEFLAGS="-j$(nproc) -Otarget" CI=1 bash ci/check.sh ${{ matrix.group }}

  # Report-only: the duplicated code and long functions a pull request adds in src/ and lib/,
  # from qgate (ci/qgate_report.py, MO-100), in the job summary and as notices on the diff. It
  # never fails: the script always exits 0, the job may fail without failing the run, and
  # `check` below does not wait for it. Skipped for docs-only changes and pushes to main.
  qgate:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    env:
      QGATE_VERSION: 0.1.0
      QGATE_SHA256: ea2d62b8bc888a9b60ad72dd28bd6d970dc5b18807657d135500212113881214
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install qgate ${{ env.QGATE_VERSION }}
        run: |
          archive=qgate-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/robertguss/qgate/releases/download/v$QGATE_VERSION/$archive"
          echo "$QGATE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" qgate
      - name: New duplication and long functions (report only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/qgate_report.py --qgate "$RUNNER_TEMP/qgate" "$BASE_SHA"

  # One status to require in branch protection: it passes only when every
  # group that ran passed, or when none ran for a docs-only change.
  check:
    if: always()
    needs: [changes, group]
    runs-on: ubuntu-24.04
    steps:
      - name: Every group passed
        env:
          CHANGES: ${{ needs.changes.result }}
          GROUPS_RESULT: ${{ needs.group.result }}
          GROUPS: ${{ needs.changes.outputs.groups }}
        run: |
          test "$CHANGES" = success
          if [ "$GROUPS" = '[]' ]; then
            test "$GROUPS_RESULT" = skipped
          else
            test "$GROUPS_RESULT" = success
          fi
