# Runs the fast groups of ci/check.sh on each pull request and push to main: the
# gate a pull request needs to merge. The slow groups run each night against main
# (.github/workflows/nightly.yml); ci/orb/README.md has the two tiers. The
# repository is public, so GitHub's standard hosted runners cost no Actions
# minutes here. The groups run as parallel jobs, one per group of ci/check.sh.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running check. Pushes to main queue instead: each
# one checks only its own range, so a cancelled run would leave that range unchecked.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which groups a change needs (ci/ci_groups.sh): none when it changes only
  # documents no check reads, the fast groups otherwise. `check` below still
  # reports, so the required status is met. A manual run has no range to look at
  # and runs the fast groups.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.filter.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which groups does this change need?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
          pull_request) groups=$(sh ci/ci_groups.sh "$PR_BASE") ;;
          push) groups=$(sh ci/ci_groups.sh "$PUSH_BASE") ;;
          *) groups=$(sh ci/ci_groups.sh --fast) ;;
          esac
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Groups: $groups"

  group:
    name: ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      # Only what this group needs: the full install (CBMC, Lean) can take minutes.
      - name: Install the toolchain
        run: bash .agents/setup ${{ matrix.group }}

      # make format-check expects clang-format 14 (ci/orb/README.md); the
      # runner's own clang-format is newer and can format differently.
      - name: Install clang-format 14
        run: |
          pipx install clang-format==14.0.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # -j runs the builds and the unit tests side by side; -Otarget keeps each
      # test's output together.
      - name: Run the ${{ matrix.group }} checks
        run: MAKEFLAGS="-j$(nproc) -Otarget" CI=1 bash ci/check.sh ${{ matrix.group }}

  # One status to require in branch protection: it passes only when every
  # group that ran passed, or when none ran for a docs-only change.
  check:
    if: always()
    needs: [changes, group]
    runs-on: ubuntu-24.04
    steps:
      - name: Every group passed
        env:
          CHANGES: ${{ needs.changes.result }}
          GROUPS_RESULT: ${{ needs.group.result }}
          GROUPS: ${{ needs.changes.outputs.groups }}
        run: |
          test "$CHANGES" = success
          if [ "$GROUPS" = '[]' ]; then
            test "$GROUPS_RESULT" = skipped
          else
            test "$GROUPS_RESULT" = success
          fi
