name: nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust and static
            groups: rust static
          - name: drivers
            groups: drivers
          - name: bench
            groups: bench
          - name: lean
            groups: lean
            lean: true
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MO_CORE_DIFF_OUT: build/nightly-mismatches
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system tools (bison, python3, gcc for Bison grammar & tree-sitter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 bison

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSfL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component rustfmt,clippy
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup component add rustfmt clippy
          fi

      - name: Install Lean
        if: matrix.lean
        run: |
          # Lean 4 through elan in /opt/elan (the version formal/lean-toolchain names).
          export ELAN_HOME=/opt/elan
          sudo mkdir -p "$ELAN_HOME"
          sudo chown "$(id -u):$(id -g)" "$ELAN_HOME"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install "$(cat formal/lean-toolchain)"

      - name: Run the checks
        run: bash ci/check.sh ${{ matrix.groups }}

      - name: Compare a fresh Core differential seed range against Lean
        if: matrix.lean
        run: |
          python3 ci/check_rust_frontend.py \
            --mo target/release/mo \
            --mo-fe target/release/mo-fe \
            --mo-rt target/release/mo-rt \
            --skip-build --require-lean --lean-only --generated-count 1000

      - name: Keep programs that differ
        if: failure() && matrix.lean
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-mismatches
          path: ${{ env.MO_CORE_DIFF_OUT }}
          if-no-files-found: ignore
