[workspace]
resolver = "3"
members = [
    "crates/mo-def",
    "crates/mo-base",
    "crates/mo-core",
    "crates/mo-syntax",
    "crates/mo-check",
    "crates/mo-lower",
    "crates/mo-codegen",
    "crates/mo-fe",
    "crates/mo-bytecode",
    "crates/mo-heap",
    "crates/mo-prim",
    "crates/mo-host",
    "crates/mo-vm",
    "crates/mo-rt",
    "crates/mo-test",
    "crates/mo-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
let_underscore_future = "deny"
or_fun_call = "warn"
undocumented_unsafe_blocks = "deny"
large_futures = "warn"
