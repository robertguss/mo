[package]
name = "mo-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mo-def = { path = "../mo-def" }
mo-bytecode = { path = "../mo-bytecode" }
mo-heap = { path = "../mo-heap" }
getrandom = "0.4"
rusqlite = { version = "0.39", features = ["bundled", "hooks", "serialize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rustls-pki-types = "1.16"
sha2 = { version = "0.11", features = ["zeroize"] }
webpki-roots = "1.0"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "process", "time"] }

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
