[package]
name = "mo-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
name = "mo_cli"
path = "src/lib.rs"

[[bin]]
name = "mo"
path = "src/main.rs"

[[bin]]
name = "mo-test-deadline"
path = "src/bin/test_deadline.rs"

[[bin]]
name = "mo-test-cli"
path = "src/bin/test_cli.rs"

[dependencies]
mo-base = { path = "../mo-base" }
mo-bytecode = { path = "../mo-bytecode" }
mo-check = { path = "../mo-check" }
mo-codegen = { path = "../mo-codegen" }
mo-core = { path = "../mo-core" }
mo-def = { path = "../mo-def" }
mo-heap = { path = "../mo-heap" }
mo-host = { path = "../mo-host" }
mo-lower = { path = "../mo-lower" }
mo-prim = { path = "../mo-prim" }
mo-service = { path = "../mo-service" }
mo-syntax = { path = "../mo-syntax" }
mo-test = { path = "../mo-test" }
mo-vm = { path = "../mo-vm" }
sha2 = { version = "0.11", features = ["zeroize"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[lints]
workspace = true
