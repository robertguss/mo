[package]
name = "mo-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
name = "mo_cli"
path = "src/lib.rs"

[[bin]]
name = "mo"
path = "src/main.rs"

[[bin]]
name = "mo-test-deadline"
path = "src/bin/test_deadline.rs"

[[bin]]
name = "mo-test-cli"
path = "src/bin/test_cli.rs"

[dependencies]
mo-base.workspace = true
mo-bytecode.workspace = true
mo-check.workspace = true
mo-codegen.workspace = true
mo-core.workspace = true
mo-def.workspace = true
mo-heap.workspace = true
mo-host.workspace = true
mo-lower.workspace = true
mo-prim.workspace = true
mo-service.workspace = true
mo-syntax.workspace = true
mo-test.workspace = true
mo-upgrade.workspace = true
mo-vm.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[lints]
workspace = true
